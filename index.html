<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recruitment dashboard</title>
<style>
/* Written conservatively (no CSS variables / grid / modern JS) because TV browsers can be old. */
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #0b1220; color: #e8edf5; font-family: Arial, Helvetica, sans-serif; overflow: hidden; }
#wrap { padding: 1.2vw 1.6vw; }
#top { overflow: hidden; margin-bottom: 0.8vw; }
#title { float: left; font-size: 2vw; font-weight: bold; }
#meta { float: right; font-size: 1.2vw; color: #9fb0c8; padding-top: 0.6vw; }
#banner { display: none; background: #b42318; color: #fff; font-size: 1.3vw; padding: 0.5vw 1vw; margin-bottom: 0.6vw; }
table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 1.15vw; }
th { background: #16223a; color: #9fb0c8; font-weight: bold; padding: 0.5vw 0.3vw; text-align: center; border-bottom: 0.15vw solid #2a3a5a; vertical-align: bottom; }
th.group { background: #0f1a30; color: #6ea8fe; font-size: 1vw; text-transform: uppercase; letter-spacing: 0.08vw; border-bottom: 0; border-left: 1px solid #0b1220; }
td { padding: 0.65vw 0.3vw; text-align: center; border-bottom: 1px solid #1f2d4a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
td.left, th.left { text-align: left; padding-left: 0.6vw; }
tr.even td { background: #0f1830; }
.pill { display: inline-block; padding: 0.15vw 0.7vw; border-radius: 1vw; color: #0b1220; font-weight: bold; }
.up { color: #3ddc97; } .down { color: #ff6b6b; } .flat { color: #9fb0c8; }
.chg { font-size: 0.9vw; margin-left: 0.4vw; }
td.red { background: #7a1f24; color: #fff; font-weight: bold; }
td.amber { background: #6b4a0f; color: #fff; }
.green { color: #3ddc97; } .amberText { color: #f5a524; } .redText { color: #ff6b6b; }
#foot { position: fixed; left: 1.6vw; right: 1.6vw; bottom: 0.8vw; font-size: 1.05vw; color: #9fb0c8; overflow: hidden; }
#foot .r { float: right; }
</style>
</head>
<body>
<div id="wrap">
  <div id="top">
    <div id="title">Recruitment dashboard</div>
    <div id="meta"></div>
  </div>
  <div id="banner"></div>
  <table>
    <colgroup>
      <col style="width:13%"><col style="width:5%"><col style="width:5.5%"><col style="width:5%"><col style="width:5%">
      <col style="width:5.5%"><col style="width:5%"><col style="width:5%"><col style="width:5%"><col style="width:6.5%">
      <col style="width:6.5%"><col style="width:5.5%"><col style="width:4.5%"><col style="width:4.5%"><col style="width:5.5%">
      <col style="width:5.5%"><col style="width:7.5%">
    </colgroup>
    <thead id="thead"></thead>
    <tbody id="tbody"></tbody>
  </table>
</div>
<div id="foot"></div>

<script>
(function () {
  // ---- settings (can be overridden in the URL, e.g. ?rows=10&secs=30) ----
  var params = {};
  location.search.replace(/^\?/, '').split('&').forEach(function (p) {
    if (!p) return;
    var kv = p.split('=');
    params[kv[0]] = decodeURIComponent(kv[1] || '');
  });
  var ROWS = parseInt(params.rows, 10) || 12;        // roles shown per screen
  var SECS = parseInt(params.secs, 10) || 20;        // seconds per screen
  var RELOAD_MINUTES = 10;                           // how often data.json is re-read
  var STALE_HOURS = 12;                              // show a red warning if data is older than this

  var GROUPS = [
    { label: '', span: 5 },
    { label: 'Applicant generation', span: 7 },
    { label: 'Applicant processing', span: 4 },
    { label: '', span: 1 }
  ];
  var COLS = [
    { h: 'Role', k: 'role', t: 'role' },
    { h: 'Checklist', k: 'checklist', t: 'checklist' },
    { h: 'Priority', k: 'priority', t: 'priority' },
    { h: 'P(hire)', k: 'phire', t: 'phire' },
    { h: 'Expected hire', k: 'start', t: 'text' },
    { h: 'Applicants', k: 'applicants', t: 'int' },
    { h: '% Outbound', k: 'pOut', t: 'pct' },
    { h: '% Network', k: 'pNet', t: 'pct' },
    { h: '% Inbound', k: 'pIn', t: 'pct' },
    { h: 'Network eng. / week', k: 'engW', d: 'engWChg', t: 'delta' },
    { h: 'Network eng. / month', k: 'engM', d: 'engMChg', t: 'delta' },
    { h: 'Outstanding actions', k: 'outstanding', t: 'amber' },
    { h: 'At review', k: 'review', t: 'int' },
    { h: '>2 days at review', k: 'over2', t: 'red' },
    { h: 'WPs / week', k: 'wpW', d: 'wpWChg', t: 'delta' },
    { h: 'WPs / month', k: 'wpM', d: 'wpMChg', t: 'delta' },
    { h: 'Hiring manager', k: 'owner', t: 'text' }
  ];
  var PRIORITY_RANK = { High: 0, Medium: 1, Low: 2 };
  var PRIORITY_COLOR = { High: '#ff6b6b', Medium: '#f5a524', Low: '#3ddc97' };

  var data = null, rows = [], pageIdx = 0;

  // ---- helpers ----
  function isNum(v) { return typeof v === 'number' && !isNaN(v); }
  function el(tag, text, cls) {
    var e = document.createElement(tag);
    if (text !== undefined && text !== null) e.textContent = text;
    if (cls) e.className = cls;
    return e;
  }
  function fmtPct(v) {
    if (typeof v === 'string' && v !== '') return v;
    if (!isNum(v)) return '\u2013';
    var p = v * 100;
    return (Math.abs(p) < 10 && p !== 0 ? p.toFixed(1) : Math.round(p)) + '%';
  }
  function fmtInt(v) { return isNum(v) ? String(v) : '\u2013'; }
  function prioList(v) {
    if (!v) return [];
    return (typeof v === 'string') ? [v] : v;
  }
  function prioRank(v) {
    var best = 9, l = prioList(v);
    for (var i = 0; i < l.length; i++) {
      var r = PRIORITY_RANK[l[i]];
      if (r !== undefined && r < best) best = r;
    }
    return best;
  }
  function sortRows(list) {
    return list.slice().sort(function (a, b) {
      var d = prioRank(a.priority) - prioRank(b.priority);
      if (d !== 0) return d;
      var pa = isNum(a.phire) ? a.phire : -1, pb = isNum(b.phire) ? b.phire : -1;
      if (pa !== pb) return pb - pa;
      return String(a.role || '').localeCompare(String(b.role || ''));
    });
  }

  // ---- header ----
  function buildHead() {
    var thead = document.getElementById('thead');
    thead.innerHTML = '';
    var g = el('tr');
    GROUPS.forEach(function (grp) {
      var th = el('th', grp.label, 'group');
      th.colSpan = grp.span;
      g.appendChild(th);
    });
    thead.appendChild(g);
    var h = el('tr');
    COLS.forEach(function (c) { h.appendChild(el('th', c.h, c.t === 'role' ? 'left' : '')); });
    thead.appendChild(h);
  }

  // ---- cells ----
  function cellFor(c, r) {
    var v = r[c.k], td, i;
    if (c.t === 'role') { td = el('td', v || '', 'left'); td.style.fontWeight = 'bold'; return td; }
    if (c.t === 'priority') {
      td = el('td');
      var l = prioList(v);
      for (i = 0; i < l.length; i++) {
        var pill = el('span', l[i], 'pill');
        pill.style.background = PRIORITY_COLOR[l[i]] || '#9fb0c8';
        td.appendChild(pill);
      }
      if (!l.length) td.textContent = '\u2013';
      return td;
    }
    if (c.t === 'checklist') {
      td = el('td', fmtPct(v));
      if (isNum(v)) td.className = v >= 1 ? 'green' : (v >= 0.5 ? 'amberText' : 'redText');
      return td;
    }
    if (c.t === 'phire') return el('td', isNum(v) ? v.toFixed(3) : '\u2013');
    if (c.t === 'pct') return el('td', fmtPct(v));
    if (c.t === 'delta') {
      td = el('td', fmtInt(v));
      var d = r[c.d];
      if (isNum(d)) {
        td.appendChild(el('span', '\u00A0' + (d > 0 ? '\u25B2' : (d < 0 ? '\u25BC' : '')) + Math.abs(Math.round(d * 100)) + '%',
          'chg ' + (d > 0 ? 'up' : (d < 0 ? 'down' : 'flat'))));
      }
      return td;
    }
    if (c.t === 'amber') { td = el('td', fmtInt(v)); if (isNum(v) && v > 0) td.className = 'amber'; return td; }
    if (c.t === 'red') { td = el('td', fmtInt(v)); if (isNum(v) && v > 0) td.className = 'red'; return td; }
    if (c.t === 'int') return el('td', fmtInt(v));
    return el('td', (v === undefined || v === null || v === '') ? '\u2013' : v);
  }

  // ---- render one screen ----
  function render() {
    var tbody = document.getElementById('tbody');
    tbody.innerHTML = '';
    var pages = Math.max(1, Math.ceil(rows.length / ROWS));
    if (pageIdx >= pages) pageIdx = 0;
    var slice = rows.slice(pageIdx * ROWS, pageIdx * ROWS + ROWS);
    slice.forEach(function (r, idx) {
      var tr = el('tr', null, idx % 2 ? 'even' : '');
      COLS.forEach(function (c) { tr.appendChild(cellFor(c, r)); });
      tbody.appendChild(tr);
    });
    var foot = document.getElementById('foot');
    foot.innerHTML = '';
    foot.appendChild(el('span', 'Screen ' + (pageIdx + 1) + ' of ' + pages + '  \u00B7  ' + rows.length + ' roles'));
    var upd = data && data.updated ? new Date(data.updated) : null;
    var r2 = el('span', upd ? 'Data updated ' + upd.toLocaleString() : '', 'r');
    foot.appendChild(r2);
  }

  function showBanner() {
    var b = document.getElementById('banner');
    var msg = '';
    if (!data) msg = 'No data loaded yet';
    else if (data.sample) msg = 'SAMPLE DATA \u2013 the GitHub Action has not run yet';
    else if (data.updated) {
      var hrs = (new Date().getTime() - new Date(data.updated).getTime()) / 3600000;
      if (hrs > STALE_HOURS) msg = 'Data is ' + Math.round(hrs) + ' hours old \u2013 check the GitHub Action';
    }
    b.textContent = msg;
    b.style.display = msg ? 'block' : 'none';
  }

  // ---- load data.json ----
  function load() {
    var x = new XMLHttpRequest();
    x.open('GET', 'data.json?ts=' + new Date().getTime(), true);
    x.onreadystatechange = function () {
      if (x.readyState !== 4) return;
      if (x.status >= 200 && x.status < 300) {
        try {
          data = JSON.parse(x.responseText);
          rows = sortRows(data.roles || []);
        } catch (e) { /* keep previous data */ }
      }
      showBanner();
      render();
    };
    x.send();
  }

  buildHead();
  load();
  setInterval(function () { pageIdx++; render(); }, SECS * 1000);
  setInterval(load, RELOAD_MINUTES * 60 * 1000);
})();
</script>
</body>
</html>
