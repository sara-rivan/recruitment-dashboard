<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Network referral command centre</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
html, body { margin: 0; height: 100%; background: #e6e2da; }
.rv { container-type: size; width: 100vw; height: 100vh; min-height: 560px;
  --fg:#0a0a0a; --muted:#6b6862; --line:#3d3d3d; --soft:#d9d4cb; --panel:#fafafa; --sand:#f0ede8; --ink:#050505;
  position: relative; color: var(--fg); font-family: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  background: var(--sand); display: flex; flex-direction: column; overflow: hidden; }
.rv * { box-sizing: border-box; }
.rv-head { flex: 0 0 auto; background: var(--ink); color: #fff; padding: clamp(12px, 1.5cqw, 28px) clamp(16px, 2.2cqw, 44px); }
.rv-title { font-weight: 400; font-size: clamp(1.2rem, 2.4cqw, 2.8rem); line-height: 1.1; margin: 0; color: #fff; letter-spacing: -.01em; }
.rv-body { flex: 1 1 0; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, .3fr) minmax(0, 1.05fr); gap: clamp(10px, 1.1cqw, 20px); padding: clamp(12px, 1.4cqw, 28px) clamp(16px, 2.2cqw, 44px) 0; }
.rv-foot { flex: 0 0 auto; display: flex; justify-content: space-between; align-items: baseline; padding: clamp(8px, 1cqw, 18px) clamp(16px, 2.2cqw, 44px); font-size: clamp(.75rem, .95cqw, 1.05rem); letter-spacing: .02em; }
.rv-foot b { font-weight: 700; }
.rv-foot span { color: var(--muted); font-weight: 300; }
.rv-foot span.old { color: #b3261e; font-weight: 600; }
.rv-right { display: grid; grid-template-columns: minmax(0, 1fr); gap: clamp(10px, 1.1cqw, 20px); min-width: 0; min-height: 0; }
.rv-main { display: grid; grid-template-rows: minmax(0, .55fr) minmax(0, 1fr) minmax(0, 1.55fr); gap: clamp(10px, 1.1cqw, 20px); min-width: 0; min-height: 0; }
@container (max-width: 820px) { .rv { height: auto; } .rv-boards { grid-template-columns: minmax(0, 1fr); } .rv-body { grid-template-columns: minmax(0, 1fr); } .rv-main { grid-template-rows: none; } .rv-top { grid-template-columns: minmax(0, 1fr); } .rv-big { min-height: 120px; } .rv-weekbox { min-height: 220px; } .rv-alist, .rv-arch .rv-in { min-height: 240px; } }
.rv-card { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; min-width: 0; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
.rv-lbl { flex: 0 0 auto; font-size: clamp(.85rem, 1.25cqw, 1.5rem); font-weight: 400; color: var(--fg); line-height: 1.2; padding: .55em .8em; border-bottom: 1px solid var(--line); }
.rv-in { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: .5em; padding: clamp(8px, 1cqw, 18px); }
.rv-weekbox { position: relative; flex: 1 1 0; min-height: 90px; }
.rv-weekbox svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.rv-boards { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(10px, 1.1cqw, 20px); min-width: 0; min-height: 0; }
.rv-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: clamp(10px, 1.1cqw, 20px); min-height: 0; }
.rv-big { padding: clamp(10px, 1.3cqw, 24px); justify-content: center; gap: .3em; }
.rv-l { font-size: clamp(.8rem, min(1.2cqw, 2.4cqh), 1.4rem); font-weight: 300; color: var(--muted); }
.rv-v { font-weight: 500; color: var(--fg); font-variant-numeric: tabular-nums; line-height: 1; letter-spacing: -.02em; white-space: nowrap; align-self: flex-start; }
.rv-hero { background: var(--ink); border-color: var(--ink); }
.rv-hero .rv-l { color: #cfcfcf; } .rv-hero .rv-v { color: #fff; font-weight: 700; }
.rv-arch .rv-in { padding: 0; gap: 0; overflow: hidden; }
.rv-at { width: 100%; table-layout: fixed; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px; }
.rv-at th { font-weight: 400; color: var(--muted); font-size: 1em; text-align: left; height: var(--rh, 22px); padding: 0 1.1em; border-bottom: 1px solid var(--line); }
.rv-at th:nth-child(2) { width: 22%; text-align: right; }
.rv-at th:nth-child(3) { width: 36%; }
.rv-at td { height: var(--rh, 22px); padding: 0 1.1em; border-bottom: 1px dotted #9a958c; vertical-align: middle; white-space: nowrap; }
.rv-at td:first-child { overflow: hidden; text-overflow: ellipsis; }
.rv-at td:nth-child(2) { text-align: right; font-weight: 600; }
.rv-tot { flex: 0 0 auto; border-top: 1px solid var(--line); }
.rv-tot thead { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.rv-tot td { font-weight: 700; border-bottom: 0; }
.rv-slot { height: var(--rh, 22px); border-bottom: 1px dotted #c9c3b8; flex: 0 0 auto; }
.rv-slot:last-child { border-bottom: 0; }
.rv-pct { display: flex; align-items: center; gap: .6em; }
.rv-pct b { font-weight: 600; min-width: 2.6em; }
.rv-pct span { flex: 1 1 auto; height: .6em; background: var(--sand); border: 1px solid var(--line); border-radius: 1px; position: relative; overflow: hidden; }
.rv-pct span i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); }
.rv-lb { width: 100%; table-layout: fixed; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 16px; }
.rv-lb td { text-align: center; padding: .3em .4em; border-bottom: 1px dotted #9a958c; color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rv-lb td:first-child { text-align: left; }
.rv-lb td:last-child { width: 4.6em; }
.rv-lb tbody { counter-reset: rk; }
.rv-lb tbody tr { counter-increment: rk; }
.rv-lb tbody td:first-child::before { content: counter(rk); display: inline-block; width: 1.4em; color: var(--muted); }
.rv-lb tbody tr:last-child td { border-bottom: 0; }
.rv-alist { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; font-size: 12px; padding: .3em .7em; overflow: hidden; }
.rv-arow { display: flex; align-items: center; justify-content: space-between; gap: .6em; padding: .3em 0; border-bottom: 1px dotted #9a958c; color: var(--fg); }
.rv-arow:last-child { border-bottom: 0; }
.rv-arow span:first-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rv-anum { min-width: 2em; text-align: center; padding: .05em .45em; border-radius: 3px; font-variant-numeric: tabular-nums; font-weight: 600; background: var(--ink); color: #fff; }
.rv-empty { color: var(--muted); font-size: .95em; padding: .4em 0; }
.rv-banner { position: absolute; z-index: 5; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(240,237,232,.94); font-size: clamp(1rem, 2cqw, 2rem); text-align: center; padding: 2rem; }
.rv-banner.show { display: flex; }
</style>
</head>
<body>
<div class="rv" id="rv-root">
  <div class="rv-banner" id="rv-banner">Waiting for the first data update…<br>In GitHub, open Actions → "Update dashboard" → Run workflow.</div>
  <header class="rv-head"><h1 class="rv-title">Network referral command centre</h1></header>

  <div class="rv-body">
    <section class="rv-card rv-arch" id="archetypes">
      <div class="rv-lbl">Archetypes per role</div>
      <div class="rv-in" id="rv-archbox">
        <table class="rv-at" id="rv-arch">
          <thead><tr><th>Role</th><th># Archetypes</th><th>% engaged</th></tr></thead>
          <tbody></tbody>
        </table>
        <div id="rv-slots"></div>
        <table class="rv-at rv-tot" id="rv-tot">
          <colgroup><col style="width:42%"><col style="width:22%"><col style="width:36%"></colgroup>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <aside class="rv-card" id="actions">
      <div class="rv-lbl">Actions to do</div>
      <div class="rv-alist" id="rv-alist"></div>
    </aside>

    <div class="rv-right">
      <div class="rv-main">
        <div class="rv-top">
          <div class="rv-card rv-big rv-hero"><div class="rv-l">Engaged</div><div class="rv-v" id="v-engaged">—</div></div>
          <div class="rv-card rv-big"><div class="rv-l">Net-new hires</div><div class="rv-v" id="v-hires">—</div></div>
        </div>
        <section class="rv-card" id="weekly">
          <div class="rv-lbl">Net-new engagements by week</div>
          <div class="rv-in"><div class="rv-weekbox" id="rv-weekbox"></div></div>
        </section>
        <div class="rv-boards">
          <div class="rv-card" id="leaderboard">
            <div class="rv-lbl">Referral leaderboard</div>
            <div class="rv-in"><table class="rv-lb" id="rv-leaders"><tbody></tbody></table></div>
          </div>
          <div class="rv-card" id="engboard">
            <div class="rv-lbl">Engagement leaderboard</div>
            <div class="rv-in"><table class="rv-lb" id="rv-eng"><tbody></tbody></table></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <footer class="rv-foot"><b>RIVAN</b><span id="rv-updated"></span></footer>
</div>

<script>
(function () {
  'use strict';
  var DATA = null;
  var el = function (id) { return document.getElementById(id); };
  var fmtN = function (n) { return Number(n).toLocaleString('en-GB'); };
  var shortName = function (n) { var p = String(n || '').trim().split(/\s+/); return p.length > 1 ? p[0] + ' ' + p[p.length - 1].charAt(0).toUpperCase() + '.' : p[0] || ''; };
  var svgNS = 'http://www.w3.org/2000/svg';
  function mk(name, attrs, parent) { var n = document.createElementNS(svgNS, name); Object.keys(attrs || {}).forEach(function (a) { n.setAttribute(a, attrs[a]); }); if (parent) parent.appendChild(n); return n; }
  function td(text) { var c = document.createElement('td'); c.textContent = text; return c; }

  /* ---------- big numbers ---------- */
  function fitNumbers() {
    document.querySelectorAll('.rv-v').forEach(function (v) {
      var card = v.closest('.rv-card'); if (!card) return;
      var cs = getComputedStyle(card);
      var w = card.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      var label = card.querySelector('.rv-l');
      var h = card.clientHeight - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom) - (label ? label.offsetHeight : 0) - 12;
      if (w <= 0 || h <= 0) return;
      v.style.fontSize = '100px';
      var tw = v.offsetWidth || 1;
      v.style.fontSize = Math.max(18, Math.floor(Math.min(100 * w / tw, h * 0.92))) + 'px';
    });
  }

  /* ---------- boards ---------- */
  function fillBoard(tableId, rows) {
    var tb = el(tableId).tBodies[0]; tb.replaceChildren();
    if (!rows.length) { var tr0 = document.createElement('tr'); var c0 = td('None yet'); c0.colSpan = 2; c0.style.color = 'var(--muted)'; tr0.appendChild(c0); tb.appendChild(tr0); return; }
    rows.forEach(function (r) { var tr = document.createElement('tr'); tr.appendChild(td(r.member)); tr.appendChild(td(fmtN(r.total))); tb.appendChild(tr); });
  }

  /* one shared text size for the archetypes table, actions list and leaderboards */
  function fitText() {
    var card = el('leaderboard'), card2 = el('engboard'), list = el('rv-alist'), box = el('rv-archbox');
    var targets = [el('rv-arch'), el('rv-tot'), el('rv-leaders'), el('rv-eng'), list];
    var rh = parseFloat(box.style.getPropertyValue('--rh')) || 22;
    var fs = Math.max(9, Math.min(16, Math.round(rh * 0.6)));
    function apply() { targets.forEach(function (t) { t.style.fontSize = fs + 'px'; }); }
    apply();
    while ((card.scrollHeight > card.clientHeight + 1 || card2.scrollHeight > card2.clientHeight + 1 || list.scrollHeight > list.clientHeight + 1) && fs > 8) { fs -= 0.5; apply(); }
  }

  /* ---------- archetypes per role ---------- */
  var SLOTS = 30, abox = el('rv-archbox');
  function pctCell(p) {
    var c = document.createElement('td'), wrap = document.createElement('div'); wrap.className = 'rv-pct';
    var b = document.createElement('b'); b.textContent = p + '%';
    var bar = document.createElement('span'), fill = document.createElement('i'); fill.style.width = Math.max(0, Math.min(100, p)) + '%';
    bar.appendChild(fill); wrap.appendChild(b); wrap.appendChild(bar); c.appendChild(wrap); return c;
  }
  function archRow(r) { var tr = document.createElement('tr'); tr.appendChild(td(r.role)); tr.appendChild(td(fmtN(r.archetypes))); tr.appendChild(pctCell(Number(r.engaged_pct))); return tr; }
  function fillArch(rows0) {
    var tb = el('rv-arch').tBodies[0], tt = el('rv-tot').tBodies[0], slots = el('rv-slots');
    tb.replaceChildren(); tt.replaceChildren(); slots.replaceChildren();
    var rows = rows0.filter(function (r) { return r.role !== 'Total'; });
    var total = rows0.filter(function (r) { return r.role === 'Total'; })[0];
    var used = Math.min(SLOTS - 1, rows.length) + 1;
    for (var k = used; k < SLOTS; k++) { var d = document.createElement('div'); d.className = 'rv-slot'; slots.appendChild(d); }
    rows.forEach(function (r) { tb.appendChild(archRow(r)); });
    if (total) tt.appendChild(archRow(total));
    fitArch();
  }
  function fitArch() { abox.style.setProperty('--rh', Math.max(14, Math.floor((abox.clientHeight - 2) / (SLOTS + 1))) + 'px'); fitText(); }

  /* ---------- actions ---------- */
  function fillActions(rows) {
    var list = el('rv-alist'); list.replaceChildren();
    if (!rows.length) { var e = document.createElement('div'); e.className = 'rv-empty'; e.textContent = 'All clear'; list.appendChild(e); }
    rows.forEach(function (r) {
      var row = document.createElement('div'); row.className = 'rv-arow';
      var n = document.createElement('span'); n.textContent = shortName(r.member); n.title = r.member;
      var c = document.createElement('span'); c.className = 'rv-anum'; c.textContent = fmtN(r.actions);
      row.appendChild(n); row.appendChild(c); list.appendChild(row);
    });
    fitText();
  }

  /* ---------- weekly chart ---------- */
  function niceMax(max) { var steps = [1, 2, 5]; var pow = 1; for (;;) { for (var i = 0; i < steps.length; i++) { var step = steps[i] * pow; if (Math.ceil(max / step) <= 3) return { step: step, top: Math.ceil(max / step) * step }; } pow *= 10; } }
  function drawWeekly() {
    var wbox = el('rv-weekbox'); wbox.replaceChildren();
    if (!DATA || !DATA.weekly) return;
    var rows = DATA.weekly;
    var W = Math.max(240, wbox.clientWidth || 600), H = Math.max(100, wbox.clientHeight || 160);
    var fs = Math.max(10, Math.min(20, Math.round(Math.min(W / 40, H / 8))));
    var m = { t: fs * 1.9, r: fs * 5, b: fs * 1.9, l: fs * 2.4 };
    var svg = mk('svg', { viewBox: '0 0 ' + W + ' ' + H, width: '100%', height: '100%', role: 'img', 'aria-label': 'Net-new engagements by week' });
    var maxV = Math.max.apply(null, rows.map(function (r) { return Number(r.engagements); }).concat([1]));
    var nm = niceMax(maxV);
    var x0 = m.l + fs, x1 = W - m.r;
    var x = function (i) { return rows.length > 1 ? x0 + (x1 - x0) * i / (rows.length - 1) : (m.l + x1) / 2; };
    var y = function (v) { return (H - m.b) - (H - m.b - m.t) * v / nm.top; };
    for (var t = 0; t <= nm.top; t += nm.step) {
      mk('line', { x1: m.l, x2: W - m.r, y1: y(t), y2: y(t), stroke: '#d2ccc1', 'stroke-width': 1 }, svg);
      var lt = mk('text', { x: m.l - 6, y: y(t) + fs * 0.35, 'text-anchor': 'end', fill: '#6b6862', 'font-size': fs }, svg); lt.textContent = fmtN(t);
    }
    var every = Math.ceil(rows.length / Math.max(2, Math.floor(W / (fs * 7))));
    rows.forEach(function (r, i) {
      if ((rows.length - 1 - i) % every !== 0) return;
      var d = new Date(r.week + 'T00:00:00Z');
      var xt = mk('text', { x: x(i), y: H - m.b + fs * 1.3, 'text-anchor': 'middle', fill: '#6b6862', 'font-size': fs }, svg);
      xt.textContent = 'W/c ' + d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' });
    });
    if (rows.length > 1) {
      var path = rows.map(function (r, i) { return (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(Number(r.engagements)).toFixed(1); }).join('');
      mk('path', { d: path, fill: 'none', stroke: '#0a0a0a', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, svg);
    }
    rows.forEach(function (r, i) {
      var cx = x(i), cy = y(Number(r.engagements));
      mk('circle', { cx: cx, cy: cy, r: Math.max(3.5, fs * 0.32), fill: '#0a0a0a', stroke: '#fafafa', 'stroke-width': 1.5 }, svg);
      var vt = mk('text', { x: cx, y: cy - fs * 0.75, 'text-anchor': 'middle', fill: '#0a0a0a', 'font-size': fs, 'font-weight': 600, 'paint-order': 'stroke', stroke: '#fafafa', 'stroke-width': 3 }, svg);
      vt.textContent = fmtN(r.engagements);
    });
    wbox.appendChild(svg);
  }

  /* ---------- render ---------- */
  function updatedLabel() {
    var s = el('rv-updated');
    if (!DATA || !DATA.generated) { s.textContent = ''; return; }
    var d = new Date(DATA.generated), age = (Date.now() - d.getTime()) / 36e5;
    var t = d.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
    s.textContent = age > 3 ? 'Data last updated ' + t + ' – may be out of date' : 'Updated ' + t;
    s.className = age > 3 ? 'old' : '';
  }
  function render() {
    var pending = !DATA || !DATA.generated;
    el('rv-banner').classList.toggle('show', pending);
    if (pending) return;
    el('v-engaged').textContent = fmtN(DATA.engaged);
    el('v-hires').textContent = fmtN(DATA.hires);
    fillArch(DATA.archetype_roles || []);
    fillBoard('rv-leaders', DATA.leaders || []);
    fillBoard('rv-eng', DATA.engaged_leaders || []);
    fillActions(DATA.actions || []);
    updatedLabel();
    redraw();
  }
  function redraw() { fitNumbers(); drawWeekly(); fitArch(); }

  function load() {
    fetch('data.json?t=' + Date.now(), { cache: 'no-store' })
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function (d) { DATA = d; render(); })
      .catch(function () { /* keep showing the last data we had */ updatedLabel(); });
  }
  window.addEventListener('resize', redraw);
  if (window.ResizeObserver) new ResizeObserver(redraw).observe(el('rv-root'));
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(redraw);
  load();
  setInterval(load, 5 * 60 * 1000); // check for a new data file every 5 minutes
})();
</script>
</body>
</html>
